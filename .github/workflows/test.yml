name: Run Tests with Docker Compose

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3

      - name: Build app
        run: |
          docker buildx create --use || true
          docker buildx build \
            --file Dockerfile \
            --target dev \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t myapp/app:dev \
            --load \
            .
      
      - name: Build front-test
        run: |
          docker buildx build \
            --file Dockerfile \
            --target node-dev-test \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t myapp/front-test:dev \
            --load \
            .
          
      - name: Build nginx
        run: |
          docker buildx build \
            --file Dockerfile \
            --target nginx-dev \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t myapp/nginx:dev \
            --load \
            .

      - name: Run front tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --entrypoint "" front-test sh -c '
          set -e
          npm ci
          npm run test/ci
          '

      - name: Shutdown services
        if: always()
        run: docker compose down
